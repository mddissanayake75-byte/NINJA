
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101b10">
<title>Ninja Survival Unlimited Ninjas</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    inset: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #101b10;
    touch-action: none;
}

#hud {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    left: max(8px, env(safe-area-inset-left));
    z-index: 10;
    padding: 8px 11px;
    border: 1px solid rgba(0,255,153,.35);
    border-radius: 11px;
    background: rgba(0,0,0,.8);
    font-size: 13px;
    line-height: 1.5;
    pointer-events: none;
    white-space: nowrap;
}

#message {
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    width: max-content;
    max-width: 85vw;
    padding: 11px 15px;
    border: 2px solid #00ff99;
    border-radius: 14px;
    background: rgba(0,0,0,.94);
    font-size: clamp(14px, 3.5vw, 22px);
    font-weight: bold;
    text-align: center;
    display: none;
    pointer-events: none;
}

.controls {
    position: fixed;
    left: max(10px, env(safe-area-inset-left));
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 20;
    width: 144px;
    height: 144px;
    pointer-events: none;
}

.btn {
    position: absolute;
    width: 46px;
    height: 46px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    border-radius: 12px;
    background: rgba(255,255,255,.22);
    color: white;
    font-size: 22px;
    font-weight: bold;
    touch-action: none;
    pointer-events: auto;
}

.btn:active {
    background: rgba(0,255,153,.6);
}

.up { left: 49px; top: 0; }
.down { left: 49px; bottom: 0; }
.left { left: 0; top: 49px; }
.right { right: 0; top: 49px; }

#attack {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(20px, env(safe-area-inset-bottom));
    z-index: 20;
    width: clamp(72px, 17vw, 92px);
    height: clamp(72px, 17vw, 92px);
    padding: 0;
    border: 3px solid white;
    border-radius: 50%;
    background: #e91e63;
    color: white;
    font-size: clamp(12px, 3vw, 17px);
    font-weight: bold;
    touch-action: none;
}

#attack:active {
    background: #ff4081;
    transform: scale(.94);
}

#gameover {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    overflow-y: auto;
    background: rgba(0,0,0,.92);
    text-align: center;
    touch-action: pan-y;
}

#gameover h1 {
    color: #ff3030;
    font-size: clamp(30px, 8vw, 48px);
    margin: 10px 0;
}

#gameover p {
    margin: 6px;
    font-size: clamp(15px, 4vw, 20px);
}

#restart {
    min-height: 46px;
    margin-top: 10px;
    padding: 12px 30px;
    border: 0;
    border-radius: 12px;
    background: #00cc66;
    color: white;
    font-size: 18px;
    font-weight: bold;
    touch-action: manipulation;
}

@media (max-width: 600px) {
    #hud {
        padding: 6px 8px;
        font-size: 11px;
        line-height: 1.42;
        border-radius: 9px;
    }

    .controls {
        transform: scale(.9);
        transform-origin: bottom left;
    }

    #message {
        top: 17%;
        padding: 9px 12px;
    }
}

@media (max-height: 450px) {
    #hud {
        padding: 4px 7px;
        font-size: 10px;
        line-height: 1.32;
    }

    .controls {
        transform: scale(.7);
        transform-origin: bottom left;
        bottom: max(4px, env(safe-area-inset-bottom));
    }

    #attack {
        width: 64px;
        height: 64px;
        right: max(10px, env(safe-area-inset-right));
        bottom: max(7px, env(safe-area-inset-bottom));
        font-size: 11px;
    }

    #message {
        top: 10%;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    ❤️ Health: <span id="health">100</span><br>
    💰 Coins: <span id="coins">0</span><br>
    ⭐ Level: <span id="level">1</span><br>
    ☠️ Kills: <span id="kills">0</span><br>
    👹 Enemies: <span id="enemyCount">6</span><br>
    🥷 Ninjas: <span id="ninjaCount">1</span>
</div>

<div id="message"></div>

<div class="controls">
    <button class="btn up" data-key="up" aria-label="Move up">▲</button>
    <button class="btn down" data-key="down" aria-label="Move down">▼</button>
    <button class="btn left" data-key="left" aria-label="Move left">◀</button>
    <button class="btn right" data-key="right" aria-label="Move right">▶</button>
</div>

<button id="attack">ATTACK</button>

<div id="gameover">
    <h1>GAME OVER</h1>
    <p>Level: <span id="finalLevel"></span></p>
    <p>Kills: <span id="finalKills"></span></p>
    <p>Coins: <span id="finalCoins"></span></p>
    <p>Ninjas: <span id="finalNinjas"></span></p>
    <button id="restart">RESTART</button>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let viewWidth = innerWidth;
let viewHeight = innerHeight;
let dpr = 1;

function resize() {
    const oldW = viewWidth || innerWidth;
    const oldH = viewHeight || innerHeight;

    viewWidth = innerWidth;
    viewHeight = innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(viewWidth * dpr);
    canvas.height = Math.round(viewHeight * dpr);

    canvas.style.width = viewWidth + "px";
    canvas.style.height = viewHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (typeof player !== "undefined") {
        player.x = Math.max(
            player.r,
            Math.min(viewWidth - player.r,
                player.x / oldW * viewWidth)
        );

        player.y = Math.max(
            player.r,
            Math.min(viewHeight - player.r,
                player.y / oldH * viewHeight)
        );
    }

    if (typeof ninjas !== "undefined") {
        for (const n of ninjas) {
            n.x = Math.max(n.r, Math.min(viewWidth - n.r, n.x));
            n.y = Math.max(n.r, Math.min(viewHeight - n.r, n.y));
        }
    }
}

resize();

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => {
    setTimeout(resize, 150);
});

/* GAME DATA */

const player = {
    x: viewWidth / 2,
    y: viewHeight / 2,
    r: 18,
    speed: 4
};

let health = 100;
let coins = 0;
let level = 1;
let kills = 0;

let enemies = [];
let ninjas = [];
let keys = Object.create(null);

let gameRunning = true;
let bossAlive = false;
let messageTimer = 0;
let enemySpawnTimer = null;
let animationId = null;

/* NINJAS */

function createNinja(number) {
    return {
        id: number,
        x: player.x,
        y: player.y,
        r: 15,
        speed: 2.6 + Math.min(number * .05, 1),
        attackTimer: Math.random() * 20,
        color:
            number === 1 ? "#ff3333" :
            number === 2 ? "#3399ff" :
            number === 3 ? "#33ff66" :
            `hsl(${(number * 47) % 360},80%,55%)`
    };
}

ninjas.push(createNinja(1));

/* ENEMY SPAWNING */

function randomEdgePosition(offset = 30) {
    const side = Math.floor(Math.random() * 4);

    if (side === 0) {
        return { x: Math.random() * viewWidth, y: -offset };
    }

    if (side === 1) {
        return { x: viewWidth + offset, y: Math.random() * viewHeight };
    }

    if (side === 2) {
        return { x: Math.random() * viewWidth, y: viewHeight + offset };
    }

    return { x: -offset, y: Math.random() * viewHeight };
}

function spawnEnemy() {
    if (!gameRunning) return;

    const p = randomEdgePosition();

    enemies.push({
        x: p.x,
        y: p.y,
        r: 15,
        hp: 2,
        maxHp: 2,
        speed: 1.1 + Math.random() * .5,
        boss: false
    });
}

function spawnBoss() {
    if (bossAlive || !gameRunning) return;

    bossAlive = true;

    const p = randomEdgePosition(60);

    enemies.push({
        x: p.x,
        y: p.y,
        r: 30,
        hp: 10,
        maxHp: 10,
        speed: .65,
        boss: true
    });

    showMessage("👑 BOSS INCOMING!");
}

for (let i = 0; i < 6; i++) {
    spawnEnemy();
}

/* MESSAGES */

function showMessage(txt) {
    const msg = document.getElementById("message");

    msg.innerHTML = txt;
    msg.style.display = "block";
    messageTimer = 120;
}

/* LEVEL SYSTEM */

function checkLevel() {
    const requiredNinjas = Math.floor(level / 50) + 1;

    while (ninjas.length < requiredNinjas) {
        const newNumber = ninjas.length + 1;
        ninjas.push(createNinja(newNumber));

        showMessage(
            "🥷 NEW NINJA UNLOCKED!<br>" +
            "Ninja " + newNumber + " joined you!"
        );
    }

    if (kills > 0 && kills % 10 === 0 && !bossAlive) {
        spawnBoss();
    }
}

/* COMBAT */

function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
}

function damageEnemy(enemy, damage = 1) {
    if (!enemy || !enemies.includes(enemy)) return;

    enemy.hp -= damage;

    if (enemy.hp <= 0) {
        killEnemy(enemy);
    }
}

function killEnemy(enemy) {
    const index = enemies.indexOf(enemy);
    if (index === -1) return;

    enemies.splice(index, 1);

    if (enemy.boss) {
        bossAlive = false;
        coins += 100;
        kills += 5;
        level += 5;
        health = Math.min(100, health + 10);

        showMessage("👑 BOSS DEFEATED! +100 COINS");
    } else {
        coins += 10;
        kills++;
        level++;
        health = Math.min(100, health + 10);
    }

    checkLevel();

    // Spawn another enemy after each kill.
    if (gameRunning) {
        clearTimeout(enemySpawnTimer);

        enemySpawnTimer = setTimeout(() => {
            if (gameRunning) spawnEnemy();
        }, 300);
    }
}

/* PLAYER ATTACK */

function playerAttack() {
    if (!gameRunning) return;

    let target = null;
    let closest = Infinity;

    for (const e of enemies) {
        const d = distance(player, e);

        if (d < 180 && d < closest) {
            closest = d;
            target = e;
        }
    }

    if (target) damageEnemy(target, 1);
}

/* NINJA AI */

function updateNinjas() {
    for (let i = 1; i < ninjas.length; i++) {
        const n = ninjas[i];

        let target = null;
        let closest = Infinity;

        for (const e of enemies) {
            const d = distance(n, e);

            if (d < closest) {
                closest = d;
                target = e;
            }
        }

        if (target) {
            const dx = target.x - n.x;
            const dy = target.y - n.y;
            const d = Math.hypot(dx, dy);

            if (d > 58) {
                n.x += dx / d * n.speed;
                n.y += dy / d * n.speed;
            } else {
                n.attackTimer++;

                const delay =
                    i === 1 ? 18 :
                    i === 2 ? 15 :
                    Math.max(8, 18 - i);

                if (n.attackTimer >= delay) {
                    damageEnemy(target, 1);
                    n.attackTimer = 0;
                }
            }
        } else {
            const row = Math.floor((i - 1) / 3);
            const col = (i - 1) % 3;

            const targetX = player.x + (col - 1) * 45;
            const targetY = player.y + 55 + row * 45;

            const dx = targetX - n.x;
            const dy = targetY - n.y;
            const d = Math.hypot(dx, dy);

            if (d > 8) {
                n.x += dx / d * n.speed;
                n.y += dy / d * n.speed;
            }
        }

        n.x = Math.max(n.r, Math.min(viewWidth - n.r, n.x));
        n.y = Math.max(n.r, Math.min(viewHeight - n.r, n.y));
    }
}

/* PLAYER MOVEMENT */

function updatePlayer() {
    let dx = 0;
    let dy = 0;

    if (keys.ArrowUp || keys.w || keys.W || keys.up) dy--;
    if (keys.ArrowDown || keys.s || keys.S || keys.down) dy++;
    if (keys.ArrowLeft || keys.a || keys.A || keys.left) dx--;
    if (keys.ArrowRight || keys.d || keys.D || keys.right) dx++;

    if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);

        player.x += dx / len * player.speed;
        player.y += dy / len * player.speed;
    }

    player.x = Math.max(
        player.r,
        Math.min(viewWidth - player.r, player.x)
    );

    player.y = Math.max(
        player.r,
        Math.min(viewHeight - player.r, player.y)
    );
}

/* ENEMY MOVEMENT */

function updateEnemies() {
    for (const e of [...enemies]) {
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const d = Math.hypot(dx, dy);

        if (d > 1) {
            e.x += dx / d * e.speed;
            e.y += dy / d * e.speed;
        }

        if (d < e.r + player.r) {
            health -= e.boss ? .25 : .12;

            if (d > 0) {
                e.x -= dx / d * 5;
                e.y -= dy / d * 5;
            }

            if (health <= 0) {
                health = 0;
                endGame();
                return;
            }
        }
    }
}

/* CANVAS TAP ATTACK */

function attackAt(x, y) {
    if (!gameRunning) return;

    let target = null;
    let closest = Infinity;

    for (const e of enemies) {
        const d = Math.hypot(e.x - x, e.y - y);

        if (d < e.r + 35 && d < closest) {
            closest = d;
            target = e;
        }
    }

    if (target) damageEnemy(target, 1);
}

canvas.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;

    attackAt(e.clientX, e.clientY);
});

/* KEYBOARD */

window.addEventListener("keydown", e => {
    if ([
        "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "
    ].includes(e.key)) {
        e.preventDefault();
    }

    keys[e.key] = true;

    if (e.key === " ") playerAttack();
});

window.addEventListener("keyup", e => {
    keys[e.key] = false;
});

window.addEventListener("blur", () => {
    keys = Object.create(null);
});

/* MOBILE CONTROLS */

document.querySelectorAll(".btn").forEach(btn => {
    const key = btn.dataset.key;

    btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[key] = true;

        try {
            btn.setPointerCapture(e.pointerId);
        } catch (_) {}
    });

    function release(e) {
        e.preventDefault();
        keys[key] = false;
    }

    btn.addEventListener("pointerup", release);
    btn.addEventListener("pointercancel", release);

    btn.addEventListener("lostpointercapture", () => {
        keys[key] = false;
    });
});

document.getElementById("attack").addEventListener("pointerdown", e => {
    e.preventDefault();
    playerAttack();
});

/* DRAW NINJAS */

function drawNinja(n, number) {
    ctx.save();

    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.fill();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "white";
    ctx.fillRect(n.x - 8, n.y - 4, 5, 3);
    ctx.fillRect(n.x + 3, n.y - 4, 5, 3);

    if (number > 1) {
        ctx.fillStyle = "white";
        ctx.font = "bold 10px Arial";
        ctx.textAlign = "center";
        ctx.fillText(number, n.x, n.y + 22);
    }

    ctx.restore();
}

/* DRAW ENEMIES */

function drawEnemy(e) {
    ctx.save();

    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = e.boss ? "#8e24aa" : "#e53935";
    ctx.fill();

    ctx.strokeStyle = e.boss ? "#ffea00" : "#ff9999";
    ctx.lineWidth = e.boss ? 4 : 2;
    ctx.stroke();

    ctx.fillStyle = "white";
    ctx.fillRect(e.x - e.r * .45, e.y - e.r * .15, 6, 5);
    ctx.fillRect(e.x + e.r * .15, e.y - e.r * .15, 6, 5);

    if (e.boss) {
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.moveTo(e.x - 22, e.y - e.r - 5);
        ctx.lineTo(e.x - 12, e.y - e.r - 22);
        ctx.lineTo(e.x, e.y - e.r - 8);
        ctx.lineTo(e.x + 12, e.y - e.r - 22);
        ctx.lineTo(e.x + 22, e.y - e.r - 5);
        ctx.closePath();
        ctx.fill();
    }

    const barWidth = e.boss ? 70 : 42;
    const barHeight = 7;
    const hpPercent = Math.max(0, e.hp / e.maxHp);
    const barX = e.x - barWidth / 2;
    const barY = e.y - e.r - 18;

    ctx.fillStyle = "#222";
    ctx.fillRect(barX, barY, barWidth, barHeight);

    ctx.fillStyle = e.boss ? "#ff00ff" : "#00ff44";
    ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);

    ctx.strokeStyle = "white";
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barWidth, barHeight);

    if (e.boss) {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "center";
        ctx.fillText("BOSS", e.x, e.y + e.r + 18);
    }

    ctx.restore();
}

/* BACKGROUND */

function drawBackground() {
    ctx.fillStyle = "#101b10";
    ctx.fillRect(0, 0, viewWidth, viewHeight);

    ctx.strokeStyle = "rgba(255,255,255,.035)";
    ctx.lineWidth = 1;

    for (let x = 0; x < viewWidth; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, viewHeight);
        ctx.stroke();
    }

    for (let y = 0; y < viewHeight; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(viewWidth, y);
        ctx.stroke();
    }
}

/* HUD */

function updateHUD() {
    document.getElementById("health").textContent = Math.floor(health);
    document.getElementById("coins").textContent = coins;
    document.getElementById("level").textContent = level;
    document.getElementById("kills").textContent = kills;
    document.getElementById("enemyCount").textContent = enemies.length;
    document.getElementById("ninjaCount").textContent = ninjas.length;
}

/* GAME OVER */

function endGame() {
    if (!gameRunning) return;

    gameRunning = false;
    clearTimeout(enemySpawnTimer);

    document.getElementById("finalLevel").textContent = level;
    document.getElementById("finalKills").textContent = kills;
    document.getElementById("finalCoins").textContent = coins;
    document.getElementById("finalNinjas").textContent = ninjas.length;

    document.getElementById("gameover").style.display = "flex";
}

document.getElementById("restart").addEventListener("click", () => {
    location.reload();
});

/* MAIN GAME LOOP */

function gameLoop() {
    if (!gameRunning) return;

    updatePlayer();
    updateEnemies();

    if (!gameRunning) return;

    updateNinjas();

    drawBackground();

    for (const e of enemies) {
        drawEnemy(e);
    }

    for (let i = 0; i < ninjas.length; i++) {
        drawNinja(ninjas[i], i + 1);
    }

    if (messageTimer > 0) {
        messageTimer--;

        if (messageTimer <= 0) {
            document.getElementById("message").style.display = "none";
        }
    }

    updateHUD();

    animationId = requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
